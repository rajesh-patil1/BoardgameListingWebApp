

name: Java CI with Maven-self-hosted_runner

on:
  push:
    branches: [ "develop" ]
jobs:
  build:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Compile with Maven
      run: mvn compile
    - name: Test with Maven
      run: mvn test
    - name: Build with Maven
      run: mvn package

    
